<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZJU-ICED Catalyst Database</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
  --primary:#1e5aa8;
  --primary-dark:#164378;
  --primary-light:#e8f0fb;
  --text:#1f2933;
  --muted:#64748b;
  --border:#e2e8f0;
  --bg:#f4f6fa;
  --card:#ffffff;
  --radius:10px;
  --shadow:0 1px 3px rgba(16,42,67,.08),0 4px 16px rgba(16,42,67,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.container{max-width:1320px;margin:0 auto;padding:0 20px}

/* ---------- Header ---------- */
.header{
  background:linear-gradient(135deg,#123f73 0%,#1e5aa8 60%,#2b7ac4 100%);
  color:#fff;padding:26px 0;
  box-shadow:0 2px 12px rgba(16,42,67,.18);
}
.header-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px}
.logo{
  width:52px;height:52px;border-radius:12px;flex-shrink:0;
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;letter-spacing:.5px;
  backdrop-filter:blur(4px);
}
.brand h1{font-size:21px;font-weight:650;letter-spacing:.2px}
.brand p{font-size:13px;opacity:.8;margin-top:2px}
.gh-link{
  color:#fff;text-decoration:none;font-size:13.5px;
  border:1px solid rgba(255,255,255,.45);
  padding:8px 16px;border-radius:8px;transition:.2s;white-space:nowrap;
}
.gh-link:hover{background:rgba(255,255,255,.15)}

main{padding:26px 0 60px}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.stat-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary)}
.stat-value{font-size:26px;font-weight:700;color:var(--primary-dark);line-height:1.2}
.stat-label{font-size:12.5px;color:var(--muted);margin-top:3px}

/* ---------- Filters ---------- */
.filters{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;
  box-shadow:var(--shadow);
}
.filters input,.filters select{
  font:inherit;font-size:14px;color:var(--text);
  border:1px solid var(--border);border-radius:8px;
  padding:9px 12px;background:#fff;outline:none;transition:.15s;
}
.filters input{flex:1;min-width:240px}
.filters input:focus,.filters select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,90,168,.12)}
.filters select{min-width:160px;cursor:pointer}
.btn{
  font:inherit;font-size:14px;cursor:pointer;border-radius:8px;
  padding:9px 18px;border:1px solid var(--border);background:#fff;color:var(--text);
  transition:.15s;
}
.btn:hover{background:#f1f5f9}

/* ---------- Charts ---------- */
.charts{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:20px}
.charts-right{display:flex;flex-direction:column;gap:16px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:16px 18px;
}
.card h3{
  font-size:14.5px;font-weight:650;margin-bottom:6px;color:var(--text);
  display:flex;align-items:center;gap:8px;
}
.card h3::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--primary)}
.chart{width:100%}
.chart-lg{height:420px}
.chart-sm{height:170px}

/* ---------- Table ---------- */
.table-card{padding:0;overflow:hidden}
.table-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 12px;gap:12px;flex-wrap:wrap;
}
.table-head h3{margin:0}
.muted{color:var(--muted);font-size:13px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:960px}
thead th{
  background:#f8fafc;color:var(--muted);font-weight:600;font-size:12.5px;
  text-align:left;padding:11px 14px;white-space:nowrap;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;
}
thead th:hover{background:#eef2f7;color:var(--text)}
thead th .arrow{margin-left:5px;font-size:10px;color:var(--primary)}
tbody td{padding:11px 14px;border-bottom:1px solid #f1f5f9;white-space:nowrap}
tbody tr:hover{background:var(--primary-light)}
td.num{font-variant-numeric:tabular-nums}
.badge{
  display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;
  background:var(--primary-light);color:var(--primary-dark);
}
.empty{text-align:center;color:var(--muted);padding:36px 0 !important}

/* ---------- Pagination ---------- */
.pagination{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;border-top:1px solid var(--border);flex-wrap:wrap;
}
.pagination .btns{display:flex;gap:8px}
.page-btn{
  min-width:34px;height:34px;padding:0 14px;border-radius:8px;
  border:1px solid var(--border);background:#fff;cursor:pointer;
  font:inherit;font-size:13.5px;color:var(--text);transition:.15s;
}
.page-btn:hover:not(:disabled){background:#f1f5f9;border-color:#cbd5e1}
.page-btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Responsive ---------- */
@media(max-width:1000px){
  .charts{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
  .brand h1{font-size:17px}
  .brand p{font-size:12px}
  .stat-value{font-size:21px}
  .filters input{min-width:100%}
  .filters select{flex:1}
  .chart-lg{height:340px}
}
</style>
</head>
<body>

<!-- ==================== 顶部 ==================== -->
<header class="header">
  <div class="container header-inner">
    <div class="brand">
      <div class="logo">ICED</div>
      <div>
        <h1>ZJU-ICED Catalyst Database</h1>
        <p>催化剂性能数据平台 · Catalyst Performance Data Platform</p>
      </div>
    </div>
    <a class="gh-link" href="https://github.com/ZJU-ICED-DATA" target="_blank" rel="noopener">GitHub 仓库</a>
  </div>
</header>

<main class="container">

  <!-- ==================== 统计卡片 ==================== -->
  <section class="stats">
    <div class="stat-card">
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">催化剂条目</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statMetal">0</div>
      <div class="stat-label">金属种类</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statSupport">0</div>
      <div class="stat-label">载体种类</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statSel">0%</div>
      <div class="stat-label">平均选择性</div>
    </div>
  </section>

  <!-- ==================== 筛选栏 ==================== -->
  <section class="filters">
    <input id="searchInput" type="search" placeholder="搜索化学式、金属、载体、反应类型或来源…" />
    <select id="metalFilter"><option value="">全部金属</option></select>
    <select id="reactionFilter"><option value="">全部反应类型</option></select>
    <button class="btn" id="resetBtn">重置筛选</button>
  </section>

  <!-- ==================== 图表区 ==================== -->
  <section class="charts">
    <div class="card">
      <h3>活化能 vs. 选择性</h3>
      <div id="scatterChart" class="chart chart-lg"></div>
    </div>
    <div class="charts-right">
      <div class="card">
        <h3>各金属条目数</h3>
        <div id="barChart" class="chart chart-sm"></div>
      </div>
      <div class="card">
        <h3>反应类型分布</h3>
        <div id="pieChart" class="chart chart-sm"></div>
      </div>
    </div>
  </section>

  <!-- ==================== 数据表格 ==================== -->
  <section class="card table-card">
    <div class="table-head">
      <h3>催化剂数据集</h3>
      <span class="muted" id="resultInfo">共 0 条记录</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr id="theadRow">
            <th data-key="id">ID</th>
            <th data-key="formula">化学式</th>
            <th data-key="metal">金属</th>
            <th data-key="support">载体</th>
            <th data-key="reaction">反应类型</th>
            <th data-key="dftEnergy">DFT 能量 (eV)</th>
            <th data-key="barrier">活化能 (eV)</th>
            <th data-key="selectivity">选择性 (%)</th>
            <th data-key="temp">温度 (°C)</th>
            <th data-key="ref">数据来源</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pagination">
      <span class="muted" id="pageInfo"></span>
      <div class="btns">
        <button class="page-btn" id="prevBtn">上一页</button>
        <button class="page-btn" id="nextBtn">下一页</button>
      </div>
    </div>
  </section>

</main>

<script>
/* =========================================================================
   1. 数据区 —— 以后只需替换这里的内容
   字段说明：
     id          唯一编号
     formula     化学式 / 催化剂名称
     metal       活性金属（用于分组着色）
     support     载体
     reaction    反应类型
     dftEnergy   DFT 计算能量 (eV)
     barrier     活化能 (eV)
     selectivity 目标产物选择性 (%)
     temp        反应温度 (°C)
     ref         数据来源
   ========================================================================= */
const DATA = [
  { id:'CAT-001', formula:'Ni/Al2O3',  metal:'Ni', support:'Al2O3', reaction:'CO2 Hydrogenation', dftEnergy:-12.34, barrier:0.87, selectivity:92.5, temp:350, ref:'ZJU-ICED 2025' },
  { id:'CAT-002', formula:'Ni/SiO2',   metal:'Ni', support:'SiO2',  reaction:'CO2 Hydrogenation', dftEnergy:-11.87, barrier:0.95, selectivity:88.2, temp:380, ref:'ZJU-ICED 2025' },
  { id:'CAT-003', formula:'Ni/CeO2',   metal:'Ni', support:'CeO2',  reaction:'CO2 Hydrogenation', dftEnergy:-13.02, barrier:0.72, selectivity:95.1, temp:320, ref:'DFT-PBE 2024' },
  { id:'CAT-004', formula:'Ni/TiO2',   metal:'Ni', support:'TiO2',  reaction:'Methane Reforming', dftEnergy:-10.55, barrier:1.12, selectivity:76.4, temp:700, ref:'Lit. 2023' },
  { id:'CAT-005', formula:'Ni/ZrO2',   metal:'Ni', support:'ZrO2',  reaction:'Methane Reforming', dftEnergy:-9.88,  barrier:1.28, selectivity:71.2, temp:750, ref:'Lit. 2023' },
  { id:'CAT-006', formula:'Cu/Al2O3',  metal:'Cu', support:'Al2O3', reaction:'CO2 Hydrogenation', dftEnergy:-8.45,  barrier:0.68, selectivity:64.3, temp:280, ref:'ZJU-ICED 2025' },
  { id:'CAT-007', formula:'Cu/ZnO',    metal:'Cu', support:'ZnO',   reaction:'CO2 Hydrogenation', dftEnergy:-9.12,  barrier:0.55, selectivity:78.9, temp:260, ref:'DFT-PBE 2024' },
  { id:'CAT-008', formula:'Cu/SiO2',   metal:'Cu', support:'SiO2',  reaction:'Water-Gas Shift',   dftEnergy:-7.98,  barrier:0.92, selectivity:58.7, temp:300, ref:'Lit. 2023' },
  { id:'CAT-009', formula:'Cu/CeO2',   metal:'Cu', support:'CeO2',  reaction:'CO Oxidation',      dftEnergy:-8.76,  barrier:0.61, selectivity:82.1, temp:150, ref:'ZJU-ICED 2025' },
  { id:'CAT-010', formula:'Pd/Al2O3',  metal:'Pd', support:'Al2O3', reaction:'CO Oxidation',      dftEnergy:-9.65,  barrier:0.45, selectivity:96.8, temp:120, ref:'ZJU-ICED 2025' },
  { id:'CAT-011', formula:'Pd/CeO2',   metal:'Pd', support:'CeO2',  reaction:'CO Oxidation',      dftEnergy:-10.23, barrier:0.38, selectivity:98.2, temp:100, ref:'DFT-PBE 2024' },
  { id:'CAT-012', formula:'Pd/C',      metal:'Pd', support:'C',     reaction:'CO Oxidation',      dftEnergy:-9.11,  barrier:0.52, selectivity:94.5, temp:140, ref:'Lit. 2023' },
  { id:'CAT-013', formula:'Pd/SiO2',   metal:'Pd', support:'SiO2',  reaction:'CO2 Hydrogenation', dftEnergy:-8.94,  barrier:1.05, selectivity:61.7, temp:300, ref:'ZJU-ICED 2025' },
  { id:'CAT-014', formula:'Pt/Al2O3',  metal:'Pt', support:'Al2O3', reaction:'CO Oxidation',      dftEnergy:-11.02, barrier:0.41, selectivity:97.3, temp:110, ref:'ZJU-ICED 2025' },
  { id:'CAT-015', formula:'Pt/TiO2',   metal:'Pt', support:'TiO2',  reaction:'CO Oxidation',      dftEnergy:-10.78, barrier:0.48, selectivity:95.6, temp:130, ref:'Lit. 2023' },
  { id:'CAT-016', formula:'Pt/C',      metal:'Pt', support:'C',     reaction:'CO Oxidation',      dftEnergy:-11.45, barrier:0.35, selectivity:99.1, temp:90,  ref:'DFT-PBE 2024' },
  { id:'CAT-017', formula:'Pt/CeO2',   metal:'Pt', support:'CeO2',  reaction:'Water-Gas Shift',   dftEnergy:-10.12, barrier:0.88, selectivity:68.4, temp:280, ref:'ZJU-ICED 2025' },
  { id:'CAT-018', formula:'Ru/Al2O3',  metal:'Ru', support:'Al2O3', reaction:'NH3 Synthesis',     dftEnergy:-14.21, barrier:1.32, selectivity:84.6, temp:400, ref:'Lit. 2023' },
  { id:'CAT-019', formula:'Ru/C',      metal:'Ru', support:'C',     reaction:'NH3 Synthesis',     dftEnergy:-15.06, barrier:1.15, selectivity:89.3, temp:380, ref:'DFT-PBE 2024' },
  { id:'CAT-020', formula:'Ru/MgO',    metal:'Ru', support:'MgO',   reaction:'NH3 Synthesis',     dftEnergy:-13.78, barrier:1.41, selectivity:81.2, temp:420, ref:'Lit. 2023' },
  { id:'CAT-021', formula:'Ru/CeO2',   metal:'Ru', support:'CeO2',  reaction:'CO2 Hydrogenation', dftEnergy:-13.55, barrier:0.79, selectivity:93.7, temp:340, ref:'ZJU-ICED 2025' },
  { id:'CAT-022', formula:'Co/Al2O3',  metal:'Co', support:'Al2O3', reaction:'Fischer-Tropsch',   dftEnergy:-11.34, barrier:1.18, selectivity:72.8, temp:240, ref:'ZJU-ICED 2025' },
  { id:'CAT-023', formula:'Co/SiO2',   metal:'Co', support:'SiO2',  reaction:'Fischer-Tropsch',   dftEnergy:-10.89, barrier:1.25, selectivity:69.5, temp:230, ref:'Lit. 2023' },
  { id:'CAT-024', formula:'Co/TiO2',   metal:'Co', support:'TiO2',  reaction:'Fischer-Tropsch',   dftEnergy:-10.12, barrier:1.34, selectivity:66.1, temp:250, ref:'DFT-PBE 2024' },
  { id:'CAT-025', formula:'Fe/Al2O3',  metal:'Fe', support:'Al2O3', reaction:'Fischer-Tropsch',   dftEnergy:-9.45,  barrier:1.42, selectivity:58.3, temp:260, ref:'Lit. 2023' },
  { id:'CAT-026', formula:'Fe/C',      metal:'Fe', support:'C',     reaction:'Fischer-Tropsch',   dftEnergy:-8.87,  barrier:1.51, selectivity:54.7, temp:270, ref:'ZJU-ICED 2025' },
  { id:'CAT-027', formula:'Fe/SiO2',   metal:'Fe', support:'SiO2',  reaction:'Water-Gas Shift',   dftEnergy:-8.12,  barrier:1.08, selectivity:62.5, temp:320, ref:'Lit. 2023' },
  { id:'CAT-028', formula:'Rh/Al2O3',  metal:'Rh', support:'Al2O3', reaction:'CO2 Hydrogenation', dftEnergy:-12.87, barrier:0.82, selectivity:91.4, temp:310, ref:'ZJU-ICED 2025' },
  { id:'CAT-029', formula:'Rh/SiO2',   metal:'Rh', support:'SiO2',  reaction:'CO Oxidation',      dftEnergy:-11.76, barrier:0.44, selectivity:96.2, temp:125, ref:'DFT-PBE 2024' },
  { id:'CAT-030', formula:'Rh/CeO2',   metal:'Rh', support:'CeO2',  reaction:'Methane Reforming', dftEnergy:-11.23, barrier:0.98, selectivity:79.8, temp:680, ref:'Lit. 2023' },
  { id:'CAT-031', formula:'Ni/MgO',    metal:'Ni', support:'MgO',   reaction:'CO2 Hydrogenation', dftEnergy:-10.98, barrier:0.91, selectivity:85.3, temp:360, ref:'ZJU-ICED 2025' },
  { id:'CAT-032', formula:'Pt/ZrO2',   metal:'Pt', support:'ZrO2',  reaction:'CO Oxidation',      dftEnergy:-10.45, barrier:0.51, selectivity:93.8, temp:135, ref:'DFT-PBE 2024' },
  { id:'CAT-033', formula:'Cu/TiO2',   metal:'Cu', support:'TiO2',  reaction:'CO2 Hydrogenation', dftEnergy:-8.23,  barrier:0.74, selectivity:67.9, temp:290, ref:'Lit. 2023' },
  { id:'CAT-034', formula:'Pd/TiO2',   metal:'Pd', support:'TiO2',  reaction:'CO2 Hydrogenation', dftEnergy:-9.34,  barrier:0.96, selectivity:71.5, temp:305, ref:'ZJU-ICED 2025' },
  { id:'CAT-035', formula:'Ru/TiO2',   metal:'Ru', support:'TiO2',  reaction:'NH3 Synthesis',     dftEnergy:-14.67, barrier:1.22, selectivity:86.9, temp:395, ref:'DFT-PBE 2024' },
  { id:'CAT-036', formula:'Co/CeO2',   metal:'Co', support:'CeO2',  reaction:'Fischer-Tropsch',   dftEnergy:-11.08, barrier:1.21, selectivity:70.3, temp:245, ref:'ZJU-ICED 2025' },
  { id:'CAT-037', formula:'Fe/TiO2',   metal:'Fe', support:'TiO2',  reaction:'Fischer-Tropsch',   dftEnergy:-9.01,  barrier:1.46, selectivity:56.9, temp:265, ref:'Lit. 2023' },
  { id:'CAT-038', formula:'Rh/TiO2',   metal:'Rh', support:'TiO2',  reaction:'CO2 Hydrogenation', dftEnergy:-12.45, barrier:0.86, selectivity:89.7, temp:315, ref:'ZJU-ICED 2025' },
  { id:'CAT-039', formula:'Ni/C',      metal:'Ni', support:'C',     reaction:'Methane Reforming', dftEnergy:-9.67,  barrier:1.35, selectivity:68.2, temp:720, ref:'Lit. 2023' },
  { id:'CAT-040', formula:'Pt/SiO2',   metal:'Pt', support:'SiO2',  reaction:'CO2 Hydrogenation', dftEnergy:-9.78,  barrier:1.02, selectivity:65.8, temp:295, ref:'DFT-PBE 2024' }
];

/* =========================================================================
   2. 全局状态
   ========================================================================= */
const state = {
  search: '',
  metal: '',
  reaction: '',
  sortKey: 'id',
  sortDir: 'asc',
  page: 1,
  pageSize: 10
};

const PALETTE = ['#2b7ac4','#e8710a','#31a354','#7b5ea7','#d64550','#00a3b5','#b5921a','#8a5a44'];
const NUMERIC_KEYS = ['dftEnergy','barrier','selectivity','temp'];

const $ = id => document.getElementById(id);

/* =========================================================================
   3. 图表初始化
   ========================================================================= */
const scatterChart = echarts.init($('scatterChart'));
const barChart     = echarts.init($('barChart'));
const pieChart     = echarts.init($('pieChart'));

const AXIS_LABEL = { fontSize: 11, color: '#64748b' };
const AXIS_NAME  = { fontSize: 11.5, color: '#64748b' };

/* =========================================================================
   4. 下拉框选项生成
   ========================================================================= */
const METALS    = [...new Set(DATA.map(d => d.metal))].sort();
const REACTIONS = [...new Set(DATA.map(d => d.reaction))].sort();

METALS.forEach(m => {
  $('metalFilter').insertAdjacentHTML('beforeend', `<option value="${m}">${m}</option>`);
});
REACTIONS.forEach(r => {
  $('reactionFilter').insertAdjacentHTML('beforeend', `<option value="${r}">${r}</option>`);
});

/* =========================================================================
   5. 筛选 & 排序
   ========================================================================= */
function getFiltered() {
  const q = state.search.trim().toLowerCase();
  return DATA.filter(d => {
    if (state.metal && d.metal !== state.metal) return false;
    if (state.reaction && d.reaction !== state.reaction) return false;
    if (q) {
      const hay = [d.id, d.formula, d.metal, d.support, d.reaction, d.ref]
        .join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function sortRows(rows) {
  const key = state.sortKey;
  const dir = state.sortDir === 'asc' ? 1 : -1;
  return [...rows].sort((a, b) => {
    if (NUMERIC_KEYS.includes(key)) return (a[key] - b[key]) * dir;
    return String(a[key]).localeCompare(String(b[key])) * dir;
  });
}

/* =========================================================================
   6. 统计卡片
   ========================================================================= */
function updateStats(rows) {
  $('statTotal').textContent   = rows.length;
  $('statMetal').textContent   = new Set(rows.map(d => d.metal)).size;
  $('statSupport').textContent = new Set(rows.map(d => d.support)).size;
  const avg = rows.length
    ? rows.reduce((s, d) => s + d.selectivity, 0) / rows.length
    : 0;
  $('statSel').textContent = avg.toFixed(1) + '%';
}

/* =========================================================================
   7. 图表更新
   ========================================================================= */
function updateCharts(rows) {
  /* ---- 散点图：活化能 vs 选择性，按金属分组 ---- */
  const byMetal = {};
  rows.forEach(d => {
    if (!byMetal[d.metal]) byMetal[d.metal] = [];
    byMetal[d.metal].push(d);
  });
  const metalNames = Object.keys(byMetal).sort();

  scatterChart.setOption({
    color: PALETTE,
    tooltip: {
      trigger: 'item',
      backgroundColor: 'rgba(255,255,255,.97)',
      borderColor: '#e2e8f0',
      borderWidth: 1,
      textStyle: { color: '#1f2933', fontSize: 12.5 },
      extraCssText: 'box-shadow:0 4px 16px rgba(16,42,67,.14);border-radius:8px;',
      formatter: p => {
        const d = p.data.raw;
        return `<b>${d.formula}</b><br/>
                金属：${d.metal} · 载体：${d.support}<br/>
                反应：${d.reaction}<br/>
                活化能：<b>${d.barrier.toFixed(2)} eV</b><br/>
                选择性：<b>${d.selectivity.toFixed(1)}%</b><br/>
                温度：${d.temp} °C`;
      }
    },
    legend: {
      type: 'scroll',
      bottom: 0,
      itemWidth: 12,
      itemHeight: 12,
      textStyle: { fontSize: 11, color: '#64748b' }
    },
    grid: { left: 60, right: 24, top: 18, bottom: 52 },
    xAxis: {
      name: '活化能 (eV)',
      nameLocation: 'middle',
      nameGap: 28,
      nameTextStyle: AXIS_NAME,
      scale: true,
      axisLine: { lineStyle: { color: '#cbd5e1' } },
      axisTick: { show: false },
      axisLabel: AXIS_LABEL,
      splitLine: { lineStyle: { color: '#eef2f7' } }
    },
    yAxis: {
      name: '选择性 (%)',
      nameLocation: 'middle',
      nameGap: 42,
      nameRotate: 90,
      nameTextStyle: AXIS_NAME,
      scale: true,
      axisLine: { lineStyle: { color: '#cbd5e1' } },
      axisTick: { show: false },
      axisLabel: AXIS_LABEL,
      splitLine: { lineStyle: { color: '#eef2f7' } }
    },
    series: metalNames.map(m => ({
      name: m,
      type: 'scatter',
      symbolSize: 11,
      itemStyle: { opacity: 0.85, borderColor: '#fff', borderWidth: 1 },
      emphasis: { scale: 1.5 },
      data: byMetal[m].map(d => ({
        value: [d.barrier, d.selectivity],
        raw: d
      }))
    }))
  }, true);

  /* ---- 柱状图：各金属条目数 ---- */
  const counts = metalNames
    .map(m => ({ name: m, value: byMetal[m].length }))
    .sort((a, b) => b.value - a.value);

  barChart.setOption({
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'shadow' },
      formatter: p => `${p[0].name}：${p[0].value} 条`
    },
    grid: { left: 42, right: 18, top: 12, bottom: 26 },
    xAxis: {
      type: 'category',
      data: counts.map(c => c.name),
      axisTick: { show: false },
      axisLine: { lineStyle: { color: '#cbd5e1' } },
      axisLabel: AXIS_LABEL
    },
    yAxis: {
      type: 'value',
      minInterval: 1,
      axisLabel: AXIS_LABEL,
      splitLine: { lineStyle: { color: '#eef2f7' } }
    },
    series: [{
      type: 'bar',
      data: counts.map(c => c.value),
      barMaxWidth: 32,
      itemStyle: { borderRadius: [4, 4, 0, 0], color: '#2b7ac4' }
    }]
  }, true);

  /* ---- 环形图：反应类型分布 ---- */
  const byReaction = {};
  rows.forEach(d => { byReaction[d.reaction] = (byReaction[d.reaction] || 0) + 1; });
  const pieData = Object.entries(byReaction).map(([name, value]) => ({ name, value }));

  pieChart.setOption({
    color: PALETTE,
    tooltip: {
      trigger: 'item',
      formatter: '{b}<br/>{c} 条 ({d}%)'
    },
    legend: {
      type: 'scroll',
      bottom: 0,
      itemWidth: 10,
      itemHeight: 10,
      textStyle: { fontSize: 10.5, color: '#64748b' }
    },
    series: [{
      type: 'pie',
      radius: ['38%', '60%'],
      center: ['50%', '40%'],
      avoidLabelOverlap: true,
      itemStyle: { borderColor: '#fff', borderWidth: 2 },
      label: { show: false },
      labelLine: { show: false },
      data: pieData
    }]
  }, true);
}

/* =========================================================================
   8. 表格渲染 & 分页
   ========================================================================= */
function renderTable(rows) {
  const total = rows.length;
  const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
  if (state.page > totalPages) state.page = totalPages;

  const start = (state.page - 1) * state.pageSize;
  const pageRows = rows.slice(start, start + state.pageSize);
  const tbody = $('tbody');

  if (!pageRows.length) {
    tbody.innerHTML =
      '<tr><td class="empty" colspan="10">没有匹配的数据，试试调整筛选条件</td></tr>';
  } else {
    tbody.innerHTML = pageRows.map(d => `
      <tr>
        <td>${d.id}</td>
        <td><b>${d.formula}</b></td>
        <td><span class="badge">${d.metal}</span></td>
        <td>${d.support}</td>
        <td>${d.reaction}</td>
        <td class="num">${d.dftEnergy.toFixed(2)}</td>
        <td class="num">${d.barrier.toFixed(2)}</td>
        <td class="num">${d.selectivity.toFixed(1)}</td>
        <td class="num">${d.temp}</td>
        <td>${d.ref}</td>
      </tr>
    `).join('');
  }

  $('resultInfo').textContent = `共 ${total} 条记录`;
  $('pageInfo').textContent   = `第 ${state.page} / ${totalPages} 页`;
  $('prevBtn').disabled = state.page <= 1;
  $('nextBtn').disabled = state.page >= totalPages;
}

/* =========================================================================
   9. 排序箭头
   ========================================================================= */
function renderSortArrows() {
  document.querySelectorAll('#theadRow th').forEach(th => {
    const old = th.querySelector('.arrow');
    if (old) old.remove();
    if (th.dataset.key === state.sortKey) {
      const span = document.createElement('span');
      span.className = 'arrow';
      span.textContent = state.sortDir === 'asc' ? '▲' : '▼';
      th.appendChild(span);
    }
  });
}

/* =========================================================================
   10. 统一刷新
   ========================================================================= */
function update() {
  const rows = sortRows(getFiltered());
  updateStats(rows);
  updateCharts(rows);
  renderTable(rows);
  renderSortArrows();
}

/* =========================================================================
   11. 事件绑定
   ========================================================================= */
$('searchInput').addEventListener('input', e => {
  state.search = e.target.value;
  state.page = 1;
  update();
});

$('metalFilter').addEventListener('change', e => {
  state.metal = e.target.value;
  state.page = 1;
  update();
});

$('reactionFilter').addEventListener('change', e => {
  state.reaction = e.target.value;
  state.page = 1;
  update();
});

$('resetBtn').addEventListener('click', () => {
  state.search = '';
  state.metal = '';
  state.reaction = '';
  state.page = 1;
  $('searchInput').value = '';
  $('metalFilter').value = '';
  $('reactionFilter').value = '';
  update();
});

document.querySelectorAll('#theadRow th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (state.sortKey === key) {
      state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      state.sortKey = key;
      state.sortDir = 'asc';
    }
    update();
  });
});

$('prevBtn').addEventListener('click', () => {
  if (state.page > 1) { state.page--; update(); }
});

$('nextBtn').addEventListener('click', () => {
  const total = getFiltered().length;
  const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
  if (state.page < totalPages) { state.page++; update(); }
});

/* 窗口尺寸变化时重绘图表 */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    scatterChart.resize();
    barChart.resize();
    pieChart.resize();
  }, 120);
});

/* =========================================================================
   12. 启动
   ========================================================================= */
update();
</script>
</body>
</html>
