<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZJU-ICED Catalyst Database</title>
<meta name="description" content="ZJU-ICED 课题组催化剂 DFT 数据库：按反应体系归集 CIF 结构与 VASP 计算能量，支持上传解析、筛选检索与内容管理。" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>" />
<link rel="stylesheet" href="styles.css" />
<script src="libs/echarts.min.js"></script>
<script src="libs/3Dmol-min.js"></script>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="logo-mark" id="brandLogo">ICED</div>
      <div class="logo-text">
        <strong id="brandName">ZJU-ICED</strong>
        <span id="brandSub">Catalyst DFT Database</span>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-foot">
      <div class="sidebar-status" id="sidebarStatus"></div>
      <button class="btn-upload" id="uploadBtn">＋ 上传计算数据</button>
      <div class="sidebar-hint">CIF 必填 · OUTCAR 可选</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="打开菜单">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="topbar-actions">
        <button class="btn" id="exportBtn">导出 ▾</button>
      </div>
    </header>
    <main class="view" id="view"></main>
    <footer class="footer">
      <div class="footer-inner">
        <span id="footerNote"></span>
        <a href="https://github.com/njustzhangmj/ZJU-ICED-DATA.github.io" target="_blank" rel="noopener">GitHub 仓库</a>
      </div>
    </footer>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<div class="modal-overlay" id="uploadModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3>上传计算数据</h3>
      <button class="close-btn" id="modalClose" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="uploadBody"></div>
    <div class="modal-foot" id="uploadFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="content.js"></script>
<script src="reactions.js"></script>
<script src="cif-parser.js"></script>
<script src="outcar-parser.js"></script>
<script src="app.js"></script>
</body>
</html>
