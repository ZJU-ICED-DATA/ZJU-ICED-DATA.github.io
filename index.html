<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZJU-ICED Catalyst Database</title>
<meta name="description" content="ZJU-ICED 课题组催化剂性能数据库：支持 CIF 结构文件上传与元素/原子数自动识别，按反应类型分设子库，提供检索、筛选、排序与可视化分析。" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>" />
<link rel="stylesheet" href="styles.css" />
<script src="libs/echarts.min.js"></script>
<script src="libs/3Dmol-min.js"></script>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="logo-mark">ICED</div>
      <div class="logo-text">
        <strong>ZJU-ICED</strong>
        <span>Catalyst Database</span>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-foot">
      <button class="btn-upload" id="uploadBtn">＋ 上传 CIF 结构</button>
      <div class="sidebar-hint">本地解析，文件不会上传到服务器</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="打开菜单">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="topbar-actions">
        <button class="btn" id="exportBtn">导出 ▾</button>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<div class="modal-overlay" id="uploadModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3>上传催化剂结构（CIF）</h3>
      <button class="close-btn" id="modalClose" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="uploadBody"></div>
    <div class="modal-foot" id="uploadFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="reactions.js"></script>
<script src="cif-parser.js"></script>
<script src="app.js"></script>
</body>
</html>
