<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>实验室气路图 · 材2-607</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#fff; --line:#e3e8ef; --text:#0f172a; --muted:#64748b;
    --accent:#1d6fb8; --accent-d:#155a94; --ok:#15803d; --warn:#c2410c; --danger:#b91c1c;
    --c-high:#dc2626; --c-low:#2563eb; --c-res:#94a3b8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);font-size:14px}
  header{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#fff;border-bottom:1px solid var(--line);
         position:sticky;top:0;z-index:30;flex-wrap:wrap}
  .brand{font-weight:750;font-size:15.5px}
  .brand .sub{font-weight:500;font-size:12px;color:var(--muted);margin-left:6px}
  .tools{display:flex;align-items:center;gap:7px;margin-left:auto;flex-wrap:wrap}
  input[type=text],input[type=password],textarea,select{
    border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;font-family:inherit;background:#fff;color:var(--text)}
  input:focus,textarea:focus,select:focus{outline:2px solid #bfdbfe;border-color:#93c5fd}
  #q{width:170px}
  button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:13px;
         cursor:pointer;font-family:inherit;color:var(--text);transition:.15s}
  button:hover{background:#f1f5f9}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent-d)}
  button.danger{color:var(--danger);border-color:#fecaca}
  button.sm{padding:3px 8px;font-size:12px}
  a{text-decoration:none}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 8px;border-radius:999px;background:#eef2f7;color:#475569}
  .pill.high{background:#fef2f2;color:#b91c1c}
  .pill.low{background:#eff6ff;color:#1d4ed8}
  .pill.ok{background:#ecfdf5;color:#047857}
  .pill.warn{background:#fff7ed;color:#c2410c}
  main{display:grid;grid-template-columns:225px minmax(0,1fr) 335px;gap:10px;padding:10px;align-items:start}
  @media (max-width:1200px){ main{grid-template-columns:1fr} }
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
  .card h2{margin:0;padding:9px 12px;font-size:12.5px;font-weight:700;color:var(--muted);
           border-bottom:1px solid var(--line);letter-spacing:.3px;display:flex;align-items:center;gap:6px}
  .card h2 .r{margin-left:auto;font-weight:600}
  #list{max-height:calc(100vh - 170px);overflow:auto}
  .li{display:flex;align-items:center;gap:7px;padding:6px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer}
  .li:hover{background:#f8fafc}
  .li.active{background:#eff6ff}
  .li .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(0,0,0,.15)}
  .li .nm{font-weight:650;white-space:nowrap}
  .li .to{font-size:11px;color:var(--muted);margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:95px}
  #stage{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
  #mapWrap{position:relative;line-height:0;user-select:none;touch-action:none;border-radius:8px;overflow:hidden;
           background:#fcfdfe;border:1px solid #eef2f7}
  #mapWrap.armed{cursor:crosshair;border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.15)}
  #canvas{width:100%;height:auto;display:block}
  #markers{position:absolute;inset:0}
  .el-hit{position:absolute;cursor:move}
  .el-handle{position:absolute;width:13px;height:13px;margin:-6px 0 0 -6px;background:#1d6fb8;
             border:2px solid #fff;border-radius:3px;cursor:nwse-resize;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;padding:7px 2px 0;font-size:11.5px;color:var(--muted);line-height:1.2}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .legend .ln{display:inline-block;width:16px;height:0;border-top:2px dashed #f59e0b;margin-right:4px;vertical-align:3px}
  #elList{max-height:calc(100vh - 400px);overflow:auto}
  .el-row{display:flex;align-items:center;gap:7px;padding:6px 10px;border-bottom:1px solid #f1f5f9;cursor:pointer}
  .el-row:hover{background:#f8fafc}
  .el-row.active{background:#eff6ff}
  .el-row .tag{font-size:10px;padding:1px 6px;border-radius:999px;color:#fff;flex:0 0 auto}
  .el-row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .el-row .c{margin-left:auto;font-size:11px;color:var(--muted);flex:0 0 auto}
  .typesum{padding:7px 10px;font-size:11.8px;color:#334155;background:#f8fafc;border-bottom:1px solid #f1f5f9;line-height:1.9}
  .typesum .g{margin-left:3px}
  .chips{display:flex;gap:5px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid #f1f5f9}
  .chip{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:#fff}
  .chip.on{background:#e0f2fe;border-color:#7dd3fc;color:#0369a1;font-weight:650}
  #detail{padding:10px 12px;max-height:calc(100vh - 400px);overflow:auto}
  .dt h3{margin:0 0 2px;font-size:15.5px}
  .dt .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
  .kv{display:grid;grid-template-columns:60px 1fr;gap:5px 9px;font-size:12.5px;margin-bottom:9px}
  .kv .k{color:var(--muted)}
  .glist{display:flex;flex-wrap:wrap;gap:5px}
  .g{font-size:11.5px;padding:2px 8px;border-radius:999px;background:#f1f5f9;cursor:pointer;border:1px solid #e2e8f0}
  .g:hover{background:#e2e8f0}
  .g.hi{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
  .g.lo{background:#eff6ff;border-color:#dbeafe;color:#1d4ed8}
  .g.re{background:#f8fafc;color:#64748b}
  .empty{color:var(--muted);font-size:12.5px;padding:12px}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0f172a;color:#fff;
         padding:8px 15px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
  #toast.show{opacity:.94}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
  .modal.open{display:flex}
  .box{background:#fff;border-radius:14px;width:min(520px,96vw);max-height:92vh;overflow:auto;padding:15px 17px}
  .box h3{margin:0 0 4px;font-size:15.5px}
  .box .muted{color:var(--muted);font-size:12px;margin-bottom:10px}
  .f{margin-bottom:9px}
  .f label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
  .f input,.f textarea,.f select{width:100%}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .foot{display:flex;gap:7px;margin-top:6px;flex-wrap:wrap}
  .foot .right{margin-left:auto}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:5px 13px}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:#e0f2fe;color:#0369a1;font-weight:650}
  .tip{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:6px 10px;font-size:12.5px;margin-bottom:8px;display:none}
  .tip.show{display:block}
  @media print{
    @page{ size:A4 landscape; margin:10mm; }
    body{background:#fff}
    header,.legend,#list,#detail,aside,.tip,#toast{display:none !important}
    main{display:block;padding:0}
    #stage{border:0;padding:0}
    #mapWrap{border:0}
    .print-title{display:block !important}
  }
  .print-title{display:none;font-size:14px;font-weight:700;margin:0 0 4px}
</style>
</head>
<body>

<header>
  <div class="brand">实验室气路图<span class="sub">材 2-607 · 气源 → 用气端</span></div>
  <div class="tools">
    <input type="text" id="q" placeholder="搜索气体 / 元素…" />
    <a href="list.html"><button>速查清单</button></a>
    <button id="btnExport">导出 JSON</button>
    <button id="btnEdit">编辑</button>
    <button class="primary" id="btnAddEl" style="display:none">＋ 元素</button>
    <button class="primary" id="btnAddLine" style="display:none">＋ 气路</button>
    <span class="pill" id="status">加载中…</span>
  </div>
</header>

<main>
  <aside>
    <div class="card">
      <h2>气路清单 <span class="r" id="cnt"></span></h2>
      <div id="list"></div>
    </div>
  </aside>

  <section id="stage">
    <div class="print-title">材 2-607 实验室供气系统示意图</div>
    <div class="tip" id="tip"></div>
    <div id="mapWrap">
      <svg id="canvas" viewBox="0 0 1000 820" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="1000" height="820" fill="#ffffff"></rect>
        <g id="base"></g>
        <g id="furn"></g>
        <g id="lines"></g>
        <g id="draft"></g>
        <g id="hl"></g>
      </svg>
      <div id="markers"></div>
    </div>
    <div class="legend">
      <span><i style="background:var(--c-high)"></i>高压</span>
      <span><i style="background:var(--c-low)"></i>低压</span>
      <span><i style="background:var(--c-res)"></i>备用</span>
      <span><span class="ln"></span>选中气路</span>
    </div>
  </section>

  <aside>
    <div class="card">
      <h2>基本元素 <span class="r" id="elCount"></span></h2>
      <div class="chips" id="typeChips"></div>
      <div id="typeSummary" class="typesum" style="display:none"></div>
      <div id="elList"></div>
    </div>
    <div class="card">
      <h2>详情</h2>
      <div id="detail"><div class="empty">选择右侧元素或左侧气路</div></div>
    </div>
  </aside>
</main>

<div class="modal" id="loginModal">
  <div class="box" style="width:min(370px,96vw)">
    <h3>编辑模式</h3>
    <div class="muted">输入管理密码后可添加 / 修改元素与气路。</div>
    <div class="f"><label>用户名</label><input type="text" id="lgUser" value="admin" /></div>
    <div class="f"><label>密码</label><input type="password" id="lgPass" /></div>
    <div class="muted" id="lgErr" style="color:#b91c1c;min-height:16px"></div>
    <div class="foot"><button class="primary" id="lgOk">进入</button><button id="lgCancel">取消</button></div>
  </div>
</div>

<div class="modal" id="elModal">
  <div class="box" style="width:min(420px,96vw)">
    <h3 id="elTitle">元素</h3>
    <div class="muted" id="elHint"></div>
    <div class="row2">
      <div class="f"><label>名称</label><input type="text" id="elName" placeholder="通风柜 4 号" /></div>
      <div class="f"><label>类型</label><select id="elType"></select></div>
    </div>
    <div class="row2">
      <div class="f"><label>分区（可选）</label><input type="text" id="elZone" placeholder="如：东侧 / 通风柜区" /></div>
      <div class="f"><label>备注</label><input type="text" id="elNote" placeholder="可选" /></div>
    </div>
    <div class="foot">
      <button class="primary" id="elSave">保存</button>
      <button id="elCancel">取消</button>
      <button class="danger right" id="elDel">删除</button>
    </div>
  </div>
</div>

<div class="modal" id="lineModal">
  <div class="box">
    <h3 id="edTitle">新建气路</h3>
    <div class="muted" id="edHint"></div>
    <div class="row2">
      <div class="f"><label>气体（短标签）</label><input type="text" id="edGas" placeholder="N₂" /></div>
      <div class="f"><label>气体名称</label><input type="text" id="edName" placeholder="氮气" /></div>
    </div>
    <div class="row2">
      <div class="f"><label>气源端</label><select id="edSrc"></select></div>
      <div class="f"><label>用气端</label><select id="edUser"></select></div>
    </div>
    <div class="row2">
      <div class="f"><label>压力类型</label>
        <div class="seg" id="edLevelSeg"><button type="button" data-v="high">高压</button><button type="button" data-v="low">低压</button></div>
      </div>
      <div class="f"><label>状态</label><select id="edKind"><option value="gas">在用</option><option value="reserved">备用</option></select></div>
    </div>
    <div class="row2">
      <div class="f"><label>进气压力</label><input type="text" id="edInlet" placeholder="25 MPa" /></div>
      <div class="f"><label>输出压力</label><input type="text" id="edOutlet" placeholder="0–10 MPa" /></div>
    </div>
    <div class="row2">
      <div class="f"><label>纯度</label><input type="text" id="edPurity" placeholder="99.999%" /></div>
      <div class="f"><label>接头</label><input type="text" id="edConn" placeholder="W21.8 / G3/8" /></div>
    </div>
    <div class="row2">
      <div class="f"><label>管路材质</label><input type="text" id="edTube" placeholder="316L BA 1/4&quot; OD" /></div>
      <div class="f"><label>备注</label><input type="text" id="edNote" /></div>
    </div>
    <div class="foot">
      <button class="primary" id="edSave">保存</button>
      <button id="edCancel">取消</button>
      <button id="edDup">同源另一压力</button>
      <button class="danger right" id="edDel">删除</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  var DATA_URL = 'data.json';
  var GH = {
    owner: 'ZJU-ICED-DATA', repo: 'ZJU-ICED-DATA.github.io', branch: 'main', path: 'gas/data.json',
    tokenParts: ['github_pat_11AQ437DQ0hTx', 'IJ4ZBNcxG_n7IAgfIpAVQrOTdsfbfTBpuWEYzNIp', 'zmD0jUM8KNmIcAYWDT2729ZZqHrtl']
  };
  var ADMIN = { user: 'admin', salt: 'lab-admin-9f3c2a',
    hash: '796930e3a9bef9ffd73f2d1b2575b1e8e4530f903c3f8997fe739234d6481990' };
  var SESSION_KEY = 'gas:admin:v1';
  var VBW = 1000, VBH = 820;

  var TYPES = [
    { key: '通风柜', color: '#8b5cf6' },
    { key: '气瓶柜', color: '#f59e0b' },
    { key: '用气端', color: '#0ea5e9' },
    { key: '实验台', color: '#10b981' },
    { key: '手套箱', color: '#64748b' },
    { key: '水槽',   color: '#06b6d4' },
    { key: '门',     color: '#a3a3a3' },
    { key: '其他',   color: '#94a3b8' }
  ];
  function typeColor(t) {
    for (var i = 0; i < TYPES.length; i++) if (TYPES[i].key === t) return TYPES[i].color;
    return '#94a3b8';
  }

  var S = {
    lines: [], elements: [], plan: {}, planRects: [],
    selLine: null, selEl: null,
    editing: false, q: '', typeFilter: '',
    placing: null, newType: '其他',
    elEditId: null, lineEditId: null, level: 'high',
    drag: null, lastDrag: 0, draftRect: null
  };

  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg, ms) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, ms || 2200);
  }
  function px(x) { return (x * VBW).toFixed(1); }
  function py(y) { return (y * VBH).toFixed(1); }
  function svgEl(tag, attrs) {
    var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] !== '') el.setAttribute(k, attrs[k]); });
    return el;
  }
  function r3(v) { return Math.round(v * 1000) / 1000; }
  function findEl(id) { for (var i = 0; i < S.elements.length; i++) if (S.elements[i].id === id) return S.elements[i]; return null; }
  function findLine(id) { for (var i = 0; i < S.lines.length; i++) if (S.lines[i].id === id) return S.lines[i]; return null; }
  function elCenter(e) { return { x: r3(e.x + e.w / 2), y: r3(e.y + e.h / 2) }; }

  async function loadData() {
    try {
      var r = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var j = await r.json();
      S.lines = Array.isArray(j.lines) ? j.lines : [];
      S.elements = Array.isArray(j.elements) ? j.elements : [];
      S.plan = j.plan || {};
      try {
        var pr = await fetch('plan.json?t=' + Date.now(), { cache: 'no-store' });
        if (pr.ok) { var pj = await pr.json(); S.planRects = Array.isArray(pj.rects) ? pj.rects : []; }
      } catch (e) { S.planRects = []; }
      setStatus('已加载 ' + S.lines.length + ' 条气路 · ' + S.elements.length + ' 个元素', 'ok');
    } catch (e) {
      setStatus('读取失败：' + e.message, 'warn');
    }
    renderAll();
  }

  function setStatus(txt, cls) {
    var el = $('#status'); el.textContent = txt;
    el.className = 'pill' + (cls ? ' ' + cls : '');
  }

  /* ================= 画布 ================= */
  function drawBase() {
    var g = $('#base');
    if (!g) return;
    g.innerHTML = '';
    (S.planRects || []).forEach(function (r) {
      /* 线稿本身只有 1 个单位粗，向外扩 0.7 让墙看起来更实 */
      var pad = 0.7;
      g.appendChild(svgEl('rect', {
        x: (r[0] - pad).toFixed(2), y: (r[1] - pad).toFixed(2),
        width: (r[2] + pad * 2).toFixed(2), height: (r[3] + pad * 2).toFixed(2),
        fill: '#3f4c5c', 'shape-rendering': 'crispEdges'
      }));
    });
  }

  function drawFurniture() {
    var g = $('#furn');
    if (!g) return;
    g.innerHTML = '';

    S.elements.forEach(function (e) {
      var c = typeColor(e.type);
      var sel = S.selEl === e.id;

      /* 主体：白底 + 加粗描边（参考图风格） */
      var box = svgEl('rect', {
        x: px(e.x), y: py(e.y), width: px(e.w), height: py(e.h),
        rx: 3, fill: sel ? '#f3f8ff' : '#ffffff',
        stroke: sel ? '#1d6fb8' : c, 'stroke-width': sel ? 3 : 2.2
      });
      box.setAttribute('data-eid', e.id);
      g.appendChild(box);

      /* 类型色细条，保留分类识别 */
      if (parseFloat(px(e.w)) > 14) {
        g.appendChild(svgEl('rect', {
          x: px(e.x), y: py(e.y), width: 3.2, height: py(e.h),
          rx: 1.5, fill: c, 'fill-opacity': '0.85'
        }));
      }

      var bw = parseFloat(px(e.w)), bh = parseFloat(py(e.h));
      var name = e.name || '';
      if (!name) return;

      function emWidth(txt, size) {
        var wsum = 0;
        for (var i = 0; i < txt.length; i++) {
          wsum += (/[\u4e00-\u9fa5]/.test(txt.charAt(i))) ? 1 : 0.56;
        }
        return wsum * size;
      }

      var inside = bw >= 42 && bh >= 16;
      var fs = 10.5;
      var shown = name;
      if (inside) {
        while (fs > 7 && (emWidth(name, fs) > bw - 12 || fs > bh - 4)) fs -= 0.5;
        if (emWidth(name, fs) > bw - 12) {
          while (shown.length > 1 && emWidth(shown + '…', fs) > bw - 12) shown = shown.slice(0, -1);
          shown = shown + '…';
        }
      } else {
        fs = 9;
      }

      var tx = bw / 2 + (bw > 14 ? 1.5 : 0);
      var ty = inside ? (bh / 2 + fs * 0.34) : -4;

      var tEl = svgEl('text', {
        x: (parseFloat(px(e.x)) + tx).toFixed(1),
        y: (parseFloat(py(e.y)) + ty).toFixed(1),
        'text-anchor': 'middle', 'font-size': fs,
        fill: sel ? '#0f3f66' : '#1f2d3d', 'font-weight': 650,
        stroke: '#ffffff', 'stroke-width': inside ? 2 : 3,
        'paint-order': 'stroke', 'pointer-events': 'none'
      });
      tEl.textContent = shown;
      g.appendChild(tEl);

      /* 选中时画尺寸线（参考图的标注风格） */
      if (sel) drawDims(g, e);
    });

    var host = $('#markers');
    host.innerHTML = '';
    if (!S.editing) return;

    S.elements.forEach(function (e) {
      var hit = document.createElement('div');
      hit.className = 'el-hit';
      hit.setAttribute('data-eid', e.id);
      hit.style.cssText = 'left:' + (e.x * 100) + '%;top:' + (e.y * 100) + '%;' +
        'width:' + (e.w * 100) + '%;height:' + (e.h * 100) + '%;';
      hit.addEventListener('pointerdown', function (ev) { onElDown(ev, e.id, 'move'); });
      hit.addEventListener('click', function (ev) { ev.stopPropagation(); });
      host.appendChild(hit);
    });

    /* 选中元素的缩放手柄 */
    if (S.selEl) {
      var e2 = findEl(S.selEl);
      if (e2) {
        var h = document.createElement('div');
        h.className = 'el-handle';
        h.style.left = ((e2.x + e2.w) * 100) + '%';
        h.style.top = ((e2.y + e2.h) * 100) + '%';
        h.addEventListener('pointerdown', function (ev) { onElDown(ev, e2.id, 'resize'); });
        host.appendChild(h);
      }
    }
  }

  /* 每单位对应的毫米数（由 CAD 上 9600mm 房间宽度反推） */
  var MM_PER_UNIT = 12.1;

  function fmtM(unitsVal) {
    var m = unitsVal * MM_PER_UNIT / 1000;
    return (m >= 1 ? m.toFixed(2) : (m * 100).toFixed(0) + ' cm');
  }

  /* 在元素下方画宽度尺寸线，右侧画高度尺寸线 */
  function drawDims(g, e) {
    var x = parseFloat(px(e.x)), y = parseFloat(py(e.y));
    var w = parseFloat(px(e.w)), h = parseFloat(py(e.h));
    var col = '#3b82f6';
    var off = 14;

    /* 宽度（下方） */
    var yb = y + h + off;
    g.appendChild(svgEl('line', { x1: x, y1: yb, x2: x + w, y2: yb, stroke: col, 'stroke-width': 1.1 }));
    g.appendChild(svgEl('line', { x1: x, y1: yb - 4, x2: x, y2: yb + 4, stroke: col, 'stroke-width': 1.1 }));
    g.appendChild(svgEl('line', { x1: x + w, y1: yb - 4, x2: x + w, y2: yb + 4, stroke: col, 'stroke-width': 1.1 }));
    var t1 = svgEl('text', {
      x: (x + w / 2).toFixed(1), y: (yb + 12).toFixed(1),
      'text-anchor': 'middle', 'font-size': 10.5, fill: col, 'font-weight': 700,
      stroke: '#ffffff', 'stroke-width': 3, 'paint-order': 'stroke'
    });
    t1.textContent = fmtM(e.w * 1000);
    g.appendChild(t1);

    /* 高度（右侧） */
    var xr = x + w + off;
    g.appendChild(svgEl('line', { x1: xr, y1: y, x2: xr, y2: y + h, stroke: col, 'stroke-width': 1.1 }));
    g.appendChild(svgEl('line', { x1: xr - 4, y1: y, x2: xr + 4, y2: y, stroke: col, 'stroke-width': 1.1 }));
    g.appendChild(svgEl('line', { x1: xr - 4, y1: y + h, x2: xr + 4, y2: y + h, stroke: col, 'stroke-width': 1.1 }));
    var t2 = svgEl('text', {
      x: (xr + 5).toFixed(1), y: (y + h / 2 + 3.5).toFixed(1),
      'font-size': 10.5, fill: col, 'font-weight': 700,
      stroke: '#ffffff', 'stroke-width': 3, 'paint-order': 'stroke'
    });
    t2.textContent = fmtM(e.h * 1000 / (820 / 820));
    g.appendChild(t2);
  }

  function lineColor(l) {
    if (l.kind === 'reserved') return '#94a3b8';
    return l.level === 'low' ? '#2563eb' : '#dc2626';
  }
  function routeD(l) {
    var sx = l.source.x, sy = l.source.y, ex = l.user.x, ey = l.user.y;
    if (Math.abs(ey - sy) >= Math.abs(ex - sx) * 0.35) {
      var my = (sy + ey) / 2;
      return 'M' + px(sx) + ',' + py(sy) + ' L' + px(sx) + ',' + py(my) +
             ' L' + px(ex) + ',' + py(my) + ' L' + px(ex) + ',' + py(ey);
    }
    var mx = (sx + ex) / 2;
    return 'M' + px(sx) + ',' + py(sy) + ' L' + px(mx) + ',' + py(sy) +
           ' L' + px(mx) + ',' + py(ey) + ' L' + px(ex) + ',' + py(ey);
  }

  function drawLines() {
    var g = $('#lines'), hl = $('#hl');
    g.innerHTML = ''; hl.innerHTML = '';
    S.lines.forEach(function (l) {
      var sel = S.selLine === l.id;
      g.appendChild(svgEl('path', {
        d: routeD(l), fill: 'none', stroke: lineColor(l),
        'stroke-width': sel ? 2 : 1.4, opacity: sel ? '0.95' : '0.5'
      }));
      /* 透明加粗命中层：点线路即可选中 */
      var hit = svgEl('path', {
        d: routeD(l), fill: 'none', stroke: 'transparent', 'stroke-width': 12,
        'pointer-events': 'stroke', style: 'cursor:pointer'
      });
      hit.setAttribute('data-line-hit', l.id);
      hit.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (S.placing) return;
        selectLine(l.id);
      });
      g.appendChild(hit);
    });
    if (S.selLine) {
      var l = findLine(S.selLine);
      if (l) hl.appendChild(svgEl('path', {
        d: routeD(l), fill: 'none', stroke: lineColor(l), 'stroke-width': 2.8,
        'stroke-dasharray': '8 4', 'stroke-linejoin': 'round', 'stroke-linecap': 'round'
      }));
    }
  }

  /* ================= 元素拖动/缩放 ================= */
  function onElDown(ev, id, mode) {
    if (!S.editing) return;
    ev.preventDefault(); ev.stopPropagation();
    var wrap = $('#mapWrap'), rect = wrap.getBoundingClientRect();
    var e = findEl(id);
    if (!e) return;
    S.drag = { id: id, mode: mode, x0: ev.clientX, y0: ev.clientY,
               orig: { x: e.x, y: e.y, w: e.w, h: e.h }, moved: false };
    S.selEl = id; S.selLine = null;

    var move = function (ev2) {
      if (!S.drag) return;
      var dx = (ev2.clientX - S.drag.x0) / rect.width;
      var dy = (ev2.clientY - S.drag.y0) / rect.height;
      if (Math.abs(dx) > 0.002 || Math.abs(dy) > 0.002) S.drag.moved = true;
      var o = S.drag.orig;
      if (mode === 'move') {
        e.x = r3(Math.max(0, Math.min(1 - o.w, o.x + dx)));
        e.y = r3(Math.max(0, Math.min(1 - o.h, o.y + dy)));
      } else {
        e.w = r3(Math.max(0.02, Math.min(1 - e.x, o.w + dx)));
        e.h = r3(Math.max(0.02, Math.min(1 - e.y, o.h + dy)));
      }
      syncLineEnds();
      drawFurniture(); drawLines();
    };
    var up = function () {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      if (S.drag && S.drag.moved) {
        S.lastDrag = Date.now();
        renderElementList(); renderDetail();
        saveData('调整元素：' + e.name);
      }
      setTimeout(function () { S.drag = null; }, 0);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  }

  function syncLineEnds() {
    S.lines.forEach(function (l) {
      if (l.source.elementId) {
        var se = findEl(l.source.elementId);
        if (se) { var c1 = elCenter(se); l.source.x = c1.x; l.source.y = c1.y; l.source.name = se.name; }
      }
      if (l.user.elementId) {
        var ue = findEl(l.user.elementId);
        if (ue) { var c2 = elCenter(ue); l.user.x = c2.x; l.user.y = c2.y; l.user.name = ue.name; }
      }
    });
  }

  /* ================= 放置元素（按住拖拽，实时预览） ================= */
  function clamp01(v) { return Math.max(0, Math.min(1, v)); }
  function pointOf(ev) {
    var rect = $('#mapWrap').getBoundingClientRect();
    return {
      x: clamp01((ev.clientX - rect.left) / rect.width),
      y: clamp01((ev.clientY - rect.top) / rect.height)
    };
  }

  /* 拖动中的虚线预览框 */
  function drawDraft() {
    var g = $('#draft');
    if (!g) return;
    g.innerHTML = '';
    var d = S.draftRect;
    if (!d) return;
    var x = Math.min(d.x0, d.x1), y = Math.min(d.y0, d.y1);
    var w = Math.abs(d.x1 - d.x0), h = Math.abs(d.y1 - d.y0);
    var c = typeColor(S.newType);

    g.appendChild(svgEl('rect', {
      x: px(x), y: py(y), width: px(w), height: py(h),
      rx: 5, fill: c, 'fill-opacity': '0.18',
      stroke: c, 'stroke-width': 1.8, 'stroke-dasharray': '6 4'
    }));

    /* 尺寸标签 */
    var label = (w * 100).toFixed(0) + '% × ' + (h * 100).toFixed(0) + '%';
    var ty = py(y) - 4;
    if (ty < 12) ty = py(y + h) + 12;
    var tx = px(x);
    var txt = svgEl('text', {
      x: tx, y: ty, 'font-size': 10.5, fill: c, 'font-weight': 700,
      stroke: '#ffffff', 'stroke-width': 3, 'paint-order': 'stroke'
    });
    txt.textContent = label;
    g.appendChild(txt);
  }

  function bindPlacing() {
    var wrap = $('#mapWrap');

    wrap.addEventListener('pointerdown', function (ev) {
      if (!S.editing || S.placing !== 'element') return;
      if (ev.target.closest && ev.target.closest('[data-eid]')) return;
      if (ev.button !== undefined && ev.button !== 0) return;
      ev.preventDefault();

      var p = pointOf(ev);
      S.draftRect = { x0: p.x, y0: p.y, x1: p.x, y1: p.y, moved: false };
      drawDraft();
      showTip('拖出方框大小，松手后命名（也可以直接单击放一个小方框）');
      try { wrap.setPointerCapture(ev.pointerId); } catch (e) { /* 忽略 */ }
    });

    wrap.addEventListener('pointermove', function (ev) {
      if (!S.draftRect) return;
      ev.preventDefault();
      var p = pointOf(ev);
      if (Math.abs(p.x - S.draftRect.x0) > 0.004 || Math.abs(p.y - S.draftRect.y0) > 0.004) {
        S.draftRect.moved = true;
      }
      S.draftRect.x1 = p.x;
      S.draftRect.y1 = p.y;
      drawDraft();
    });

    var finish = function (ev) {
      if (!S.draftRect) return;
      var d = S.draftRect;
      S.draftRect = null;
      drawDraft();

      var x = Math.min(d.x0, d.x1), y = Math.min(d.y0, d.y1);
      var w = Math.abs(d.x1 - d.x0), h = Math.abs(d.y1 - d.y0);

      /* 只是点了一下（几乎没拖动）→ 用默认尺寸居中 */
      if (w < 0.015 || h < 0.015) {
        w = 0.10; h = 0.05;
        x = clamp01(x - w / 2);
        y = clamp01(y - h / 2);
      }
      if (x + w > 1) x = 1 - w;
      if (y + h > 1) y = 1 - h;

      var e = {
        id: 'e-' + Date.now().toString(36), type: S.newType, name: '',
        x: r3(x), y: r3(y), w: r3(Math.max(0.02, w)), h: r3(Math.max(0.02, h)), note: ''
      };
      S.elements.push(e);
      S.selEl = e.id;
      stopPlacing();
      drawFurniture();
      renderElementList(); renderDetail();
      openElModal(e.id);
    };

    wrap.addEventListener('pointerup', finish);
    wrap.addEventListener('pointercancel', finish);
  }

  function showTip(msg) {
    var t = $('#tip');
    if (!msg) { t.classList.remove('show'); t.textContent = ''; return; }
    t.textContent = msg; t.classList.add('show');
  }
  function startPlacing() {
    S.newType = S.typeFilter || '其他';
    S.placing = 'element';
    S.draftRect = null;
    drawDraft();
    $('#mapWrap').classList.add('armed');
    showTip('按住鼠标拖出「' + S.newType + '」的大小，松手后命名');
    setStatus('拖拽绘制中…', 'warn');
  }
  function stopPlacing() {
    S.placing = null;
    S.draftRect = null;
    drawDraft();
    $('#mapWrap').classList.remove('armed');
    showTip('');
    setStatus(S.editing ? '编辑模式' : '浏览模式', S.editing ? 'warn' : '');
  }

  /* ================= 元素弹窗 ================= */
  function openElModal(id) {
    var e = findEl(id);
    if (!e) return;
    S.elEditId = id;
    $('#elTitle').textContent = '元素：' + (e.name || '未命名');
    $('#elHint').textContent = '尺寸约 ' + fmtM(e.w * 1000) + ' × ' + fmtM(e.h * 1000) +
      '　·　位置 x=' + e.x.toFixed(3) + ' y=' + e.y.toFixed(3);
    $('#elName').value = e.name || '';
    $('#elType').value = e.type || '其他';
    $('#elNote').value = e.note || '';
    $('#elZone').value = e.zone || '';
    $('#elModal').classList.add('open');
    $('#elName').focus();
  }

  function bindElModal() {
    $('#elCancel').addEventListener('click', function () { $('#elModal').classList.remove('open'); });
    $('#elSave').addEventListener('click', function () {
      var e = findEl(S.elEditId);
      if (!e) return;
      e.name = $('#elName').value.trim() || '未命名';
      e.type = $('#elType').value;
      e.note = $('#elNote').value.trim();
      e.zone = $('#elZone').value.trim();
      $('#elModal').classList.remove('open');
      syncLineEnds();
      renderAll();
      saveData('元素：' + e.name);
    });
    $('#elDel').addEventListener('click', function () {
      var id = S.elEditId;
      var used = S.lines.filter(function (l) { return l.source.elementId === id || l.user.elementId === id; });
      if (used.length && !window.confirm('该元素关联 ' + used.length + ' 条气路，删除元素会一并删除这些气路，确定？')) return;
      S.elements = S.elements.filter(function (x) { return x.id !== id; });
      S.lines = S.lines.filter(function (l) { return l.source.elementId !== id && l.user.elementId !== id; });
      if (S.selEl === id) S.selEl = null;
      $('#elModal').classList.remove('open');
      renderAll();
      saveData('删除元素');
    });
  }

  /* ================= 气路弹窗 ================= */
  function setLevel(v) {
    S.level = v;
    $$('#edLevelSeg button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-v') === v); });
  }
  function fillElSelect(sel, value) {
    sel.innerHTML = '<option value="">— 选择 —</option>' + S.elements.map(function (e) {
      return '<option value="' + esc(e.id) + '">' + esc(e.type) + ' · ' + esc(e.name) + '</option>';
    }).join('');
    sel.value = value || '';
  }

  function openLineModal(id) {
    var l = id ? findLine(id) : null;
    S.lineEditId = id || null;
    setLevel(l ? l.level : 'high');
    $('#edTitle').textContent = l ? '编辑气路：' + l.gas : '新建气路';
    $('#edHint').textContent = '气源端与用气端都从元素中选择，便于按设备分类查询';
    $('#edGas').value = l ? l.gas : '';
    $('#edName').value = l ? (l.name || '') : '';
    $('#edKind').value = l ? (l.kind || 'gas') : 'gas';
    fillElSelect($('#edSrc'), l ? (l.source.elementId || '') : '');
    fillElSelect($('#edUser'), l ? (l.user.elementId || '') : '');
    $('#edInlet').value = l ? (l.inlet || '') : '';
    $('#edOutlet').value = l ? (l.outlet || '') : '';
    $('#edPurity').value = l ? (l.purity || '') : '';
    $('#edConn').value = l ? (l.connector || '') : '';
    $('#edTube').value = l ? (l.tube || '') : '';
    $('#edNote').value = l ? (l.note || '') : '';
    $('#edDel').style.display = l ? '' : 'none';
    $('#edDup').style.display = l ? '' : 'none';
    $('#lineModal').classList.add('open');
    $('#edGas').focus();
  }

  function bindLineModal() {
    $('#edCancel').addEventListener('click', function () { $('#lineModal').classList.remove('open'); });
    $$('#edLevelSeg button').forEach(function (b) {
      b.addEventListener('click', function () { setLevel(b.getAttribute('data-v')); });
    });

    $('#edSave').addEventListener('click', function () {
      var gas = $('#edGas').value.trim();
      if (!gas) { toast('请填写气体标签'); return; }
      var sid = $('#edSrc').value, uid = $('#edUser').value;
      if (!sid || !uid) { toast('请选择气源端与用气端'); return; }
      if (sid === uid) { toast('气源端与用气端不能是同一个元素'); return; }
      var se = findEl(sid), ue = findEl(uid);
      if (!se || !ue) { toast('元素不存在'); return; }
      var c1 = elCenter(se), c2 = elCenter(ue);
      var rec = {
        id: S.lineEditId || ('L-' + Date.now().toString(36)),
        gas: gas, name: $('#edName').value.trim(),
        level: S.level, kind: $('#edKind').value,
        source: { elementId: sid, name: se.name, x: c1.x, y: c1.y },
        user: { elementId: uid, name: ue.name, x: c2.x, y: c2.y },
        inlet: $('#edInlet').value.trim(), outlet: $('#edOutlet').value.trim(),
        purity: $('#edPurity').value.trim(), connector: $('#edConn').value.trim(),
        tube: $('#edTube').value.trim(),
        note: $('#edNote').value.trim()
      };
      var i = -1;
      for (var k = 0; k < S.lines.length; k++) if (S.lines[k].id === rec.id) { i = k; break; }
      if (i >= 0) S.lines[i] = rec; else S.lines.push(rec);
      $('#lineModal').classList.remove('open');
      S.selLine = rec.id; S.selEl = null;
      renderAll();
      saveData('更新气路：' + rec.gas);
    });

    $('#edDup').addEventListener('click', function () {
      var l = findLine(S.lineEditId);
      if (!l) return;
      var copy = JSON.parse(JSON.stringify(l));
      copy.id = 'L-' + Date.now().toString(36);
      copy.level = l.level === 'low' ? 'high' : 'low';
      copy.note = (l.note ? l.note + ' ' : '') + '（同源另一压力支路）';
      S.lines.push(copy);
      $('#lineModal').classList.remove('open');
      S.selLine = copy.id;
      renderAll();
      saveData('同源新增' + (copy.level === 'low' ? '低压' : '高压') + '：' + copy.gas);
      toast('已复制为' + (copy.level === 'low' ? '低压' : '高压') + '支路');
    });

    $('#edDel').addEventListener('click', function () {
      var id = S.lineEditId;
      if (!id) return;
      if (!window.confirm('确定删除这条气路吗？')) return;
      S.lines = S.lines.filter(function (x) { return x.id !== id; });
      $('#lineModal').classList.remove('open');
      S.selLine = null;
      renderAll();
      saveData('删除气路');
    });
  }

  /* ================= 清单 ================= */
  function renderList() {
    var host = $('#list');
    var q = S.q.trim().toLowerCase();
    var rows = S.lines.filter(function (l) {
      if (!q) return true;
      return [l.gas, l.name, l.source.name, l.user.name, l.connector, l.purity, l.note]
        .join(' ').toLowerCase().indexOf(q) >= 0;
    });
    $('#cnt').textContent = rows.length + '/' + S.lines.length;
    if (!rows.length) { host.innerHTML = '<div class="empty">没有匹配的气路</div>'; return; }
    host.innerHTML = rows.map(function (l) {
      return '<div class="li' + (S.selLine === l.id ? ' active' : '') + '" data-id="' + esc(l.id) + '">' +
        '<span class="dot" style="background:' + lineColor(l) + '"></span>' +
        '<span class="nm">' + esc(l.gas) + (l.level === 'low' ? '·低' : '') + '</span>' +
        '<span class="to">→ ' + esc(l.user.name || '') + '</span></div>';
    }).join('');
    $$('.li', host).forEach(function (el) {
      el.addEventListener('click', function () { selectLine(el.getAttribute('data-id')); });
    });
  }

  function renderTypeChips() {
    var host = $('#typeChips');
    var counts = {};
    S.elements.forEach(function (e) { counts[e.type] = (counts[e.type] || 0) + 1; });
    var chips = [{ key: '', label: '全部 ' + S.elements.length }].concat(TYPES.map(function (t) {
      return { key: t.key, label: t.key + ' ' + (counts[t.key] || 0), color: t.color };
    }));
    host.innerHTML = chips.map(function (c) {
      return '<span class="chip' + (S.typeFilter === c.key ? ' on' : '') + '" data-type="' + esc(c.key) + '"' +
        (c.color ? ' style="border-left:3px solid ' + c.color + '"' : '') + '>' + esc(c.label) + '</span>';
    }).join('');
    $$('.chip', host).forEach(function (el) {
      el.addEventListener('click', function () {
        S.typeFilter = el.getAttribute('data-type');
        renderTypeChips(); renderElementList(); renderTypeSummary();
      });
    });
  }

  function elementsOfType() {
    return S.elements.filter(function (e) { return !S.typeFilter || e.type === S.typeFilter; })
      .sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'zh'); });
  }
  function gasesOf(elId) {
    return S.lines.filter(function (l) { return l.source.elementId === elId || l.user.elementId === elId; });
  }

  /* 当前筛选类型下：有哪些元素、合计涉及哪些气体 */
  function renderTypeSummary() {
    var box = $('#typeSummary');
    if (!box) return;
    if (!S.typeFilter) { box.style.display = 'none'; return; }

    var els = S.elements.filter(function (e) { return e.type === S.typeFilter; });
    if (!els.length) {
      box.style.display = 'block';
      box.innerHTML = '<b>' + esc(S.typeFilter) + '</b>：暂无元素';
      return;
    }
    var ids = {};
    els.forEach(function (e) { ids[e.id] = 1; });
    var gs = S.lines.filter(function (l) {
      return ids[l.source.elementId] || ids[l.user.elementId];
    });
    var seen = {}, chips = [];
    gs.forEach(function (l) {
      if (seen[l.gas]) return;
      seen[l.gas] = 1;
      var cls = l.kind === 'reserved' ? 're' : (l.level === 'low' ? 'lo' : 'hi');
      chips.push('<span class="g ' + cls + '" data-line="' + esc(l.id) + '">' + esc(l.gas) + '</span>');
    });

    box.style.display = 'block';
    box.innerHTML = '<b>' + esc(S.typeFilter) + '</b> · ' + els.length + ' 个元素 · 涉及 ' +
      (chips.length ? chips.join('') : '<span class="muted">暂无气体</span>');

    Array.prototype.forEach.call(box.querySelectorAll('.g'), function (el) {
      el.addEventListener('click', function () { selectLine(el.getAttribute('data-line')); });
    });
  }

  function renderElementList() {
    var host = $('#elList');
    var q = S.q.trim().toLowerCase();
    var rows = elementsOfType().filter(function (e) {
      if (!q) return true;
      return [e.name, e.type, e.zone, e.note].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    $('#elCount').textContent = S.elements.length;
    if (!rows.length) { host.innerHTML = '<div class="empty">还没有元素，点右上角「＋ 元素」添加</div>'; return; }
    host.innerHTML = rows.map(function (e) {
      var n = gasesOf(e.id).length;
      return '<div class="el-row' + (S.selEl === e.id ? ' active' : '') + '" data-eid="' + esc(e.id) + '">' +
        '<span class="tag" style="background:' + typeColor(e.type) + '">' + esc(e.type) + '</span>' +
        '<span class="n">' + esc(e.name) + (e.zone ? '<i style="font-style:normal;color:#94a3b8;font-size:10.5px"> ' + esc(e.zone) + '</i>' : '') + '</span>' +
        '<span class="c">' + (n ? n + ' 路' : '—') + '</span></div>';
    }).join('');
    $$('.el-row', host).forEach(function (el) {
      el.addEventListener('click', function () { selectElement(el.getAttribute('data-eid')); });
    });
  }

  /* ================= 详情 ================= */
  function renderDetail() {
    var host = $('#detail');
    if (S.selEl) {
      var e = findEl(S.selEl);
      if (!e) { host.innerHTML = '<div class="empty">选择元素或气路</div>'; return; }
      var gs = gasesOf(e.id);
      host.innerHTML = '<div class="dt">' +
        '<h3>' + esc(e.name) + '</h3>' +
        '<div class="sub">' + esc(e.type) + (e.zone ? ' · ' + esc(e.zone) : '') + (e.note ? ' · ' + esc(e.note) : '') + '</div>' +
        '<div class="kv">' +
          '<div class="k">位置</div><div>x ' + e.x.toFixed(2) + '　y ' + e.y.toFixed(2) + '</div>' +
          '<div class="k">尺寸</div><div>' + e.w.toFixed(2) + ' × ' + e.h.toFixed(2) + '</div>' +
          '<div class="k">涉及</div><div>' + gs.length + ' 条气路</div>' +
        '</div>' +
        '<div class="kv"><div class="k">气体</div><div class="glist">' +
          (gs.length ? gs.map(function (l) {
            var cls = l.kind === 'reserved' ? 're' : (l.level === 'low' ? 'lo' : 'hi');
            var dir = l.source.elementId === e.id ? '→ ' + l.user.name : '← ' + l.source.name;
            return '<span class="g ' + cls + '" data-line="' + esc(l.id) + '" title="' + esc(dir) + '">' +
              esc(l.gas) + (l.level === 'low' ? '（低压）' : '') + '</span>';
          }).join('') : '<span class="muted">暂无</span>') +
        '</div></div>' +
        (S.editing ? '<div class="foot"><button class="primary sm" id="dtElEdit">编辑元素</button></div>' : '') +
        '</div>';
      $$('.g', host).forEach(function (el) {
        el.addEventListener('click', function () { selectLine(el.getAttribute('data-line')); });
      });
      var b = $('#dtElEdit');
      if (b) b.addEventListener('click', function () { openElModal(e.id); });
      return;
    }

    if (S.selLine) {
      var l = findLine(S.selLine);
      if (!l) { host.innerHTML = '<div class="empty">选择元素或气路</div>'; return; }
      var lvl = l.level === 'low' ? '<span class="pill low">低压</span>' : '<span class="pill high">高压</span>';
      var kind = l.kind === 'reserved' ? '<span class="pill">备用</span>' : '<span class="pill ok">在用</span>';
      host.innerHTML = '<div class="dt">' +
        '<h3>' + esc(l.gas) + ' ' + lvl + ' ' + kind + '</h3>' +
        '<div class="sub">' + esc(l.name || '') + '</div>' +
        '<div class="kv">' +
          '<div class="k">气源端</div><div><b>' + esc(l.source.name) + '</b></div>' +
          '<div class="k">用气端</div><div><b>' + esc(l.user.name) + '</b></div>' +
          '<div class="k">进气</div><div>' + esc(l.inlet || '—') + '</div>' +
          '<div class="k">输出</div><div>' + esc(l.outlet || '—') + '</div>' +
          '<div class="k">纯度</div><div>' + esc(l.purity || '—') + '</div>' +
          '<div class="k">接头</div><div>' + esc(l.connector || '—') + '</div>' +
        '</div>' +
        (l.note ? '<div class="kv"><div class="k">备注</div><div>' + esc(l.note) + '</div></div>' : '') +
        (S.editing ? '<div class="foot"><button class="primary sm" id="dtLineEdit">编辑气路</button></div>' : '') +
        '</div>';
      var b2 = $('#dtLineEdit');
      if (b2) b2.addEventListener('click', function () { openLineModal(l.id); });
      return;
    }

    host.innerHTML = '<div class="empty">从右侧元素或左侧气路中选择</div>';
  }

  function selectElement(id) {
    S.selEl = id; S.selLine = null;
    drawFurniture(); drawLines(); renderElementList(); renderDetail();
  }
  function selectLine(id) {
    S.selLine = id; S.selEl = null;
    drawFurniture(); drawLines(); renderList(); renderDetail();
  }

  /* ================= 编辑开关 ================= */
  function isAuthed() { try { return sessionStorage.getItem(SESSION_KEY) === 'ok'; } catch (e) { return false; } }
  function setAuthed(v) { try { v ? sessionStorage.setItem(SESSION_KEY, 'ok') : sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
  async function sha256Hex(str) {
    var buf = new TextEncoder().encode(str);
    var d = await crypto.subtle.digest('SHA-256', buf);
    return Array.prototype.map.call(new Uint8Array(d), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  function bindEdit() {
    $('#btnEdit').addEventListener('click', function () {
      if (S.editing) {
        S.editing = false; stopPlacing();
        $('#btnEdit').textContent = '编辑';
        $('#btnAddEl').style.display = 'none';
        $('#btnAddLine').style.display = 'none';
        setStatus('浏览模式'); renderAll(); return;
      }
      if (isAuthed()) { startEdit(); return; }
      $('#loginModal').classList.add('open'); $('#lgPass').focus();
    });
    $('#lgCancel').addEventListener('click', function () { $('#loginModal').classList.remove('open'); });
    $('#lgOk').addEventListener('click', async function () {
      var u = $('#lgUser').value.trim(), p = $('#lgPass').value;
      var okUser = u === ADMIN.user, okPass = false;
      try { okPass = (await sha256Hex(ADMIN.salt + ':' + p)) === ADMIN.hash; } catch (e) {}
      if (okUser && okPass) {
        setAuthed(true); $('#loginModal').classList.remove('open'); $('#lgPass').value = ''; startEdit();
      } else {
        $('#lgErr').textContent = '用户名或密码不正确'; $('#lgPass').value = '';
      }
    });

    $('#btnAddEl').addEventListener('click', startPlacing);
    $('#btnAddLine').addEventListener('click', function () {
      if (!S.elements.length) { toast('请先添加元素'); return; }
      openLineModal(null);
    });
  }

  function startEdit() {
    S.editing = true;
    $('#btnEdit').textContent = '退出编辑';
    $('#btnAddEl').style.display = '';
    $('#btnAddLine').style.display = '';
    setStatus('编辑模式：可增删元素与气路', 'warn');
    renderAll();
  }

  /* ================= 保存 ================= */
  function ghToken() { return GH.tokenParts.join(''); }
  function ghHeaders() {
    return { 'Authorization': 'Bearer ' + ghToken(), 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
  }
  function b64(s) {
    var bytes = new TextEncoder().encode(s), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  async function saveData(msg) {
    setStatus('保存中…');
    var payload = JSON.stringify({
      updatedAt: new Date().toISOString(),
      elements: S.elements, lines: S.lines
    }, null, 1);

    var api = 'https://api.github.com/repos/' + GH.owner + '/' + GH.repo + '/contents/' + GH.path;
    var lastErr = null;

    for (var attempt = 0; attempt < 2; attempt++) {
      try {
        var cur = await fetch(api + '?ref=' + GH.branch + '&t=' + Date.now(), { headers: ghHeaders(), cache: 'no-store' });
        if (!cur.ok) {
          throw new Error('读取当前文件失败 HTTP ' + cur.status + (cur.status === 401 ? '（令牌无效）' : ''));
        }
        var sha = (await cur.json()).sha;

        var res = await fetch(api, {
          method: 'PUT', headers: ghHeaders(),
          body: JSON.stringify({ message: (msg || '更新布置') + '（网页编辑）', content: b64(payload), branch: GH.branch, sha: sha })
        });

        if (res.ok) {
          setStatus('已保存，约 1 分钟后生效', 'ok');
          toast('已保存');
          return true;
        }

        var detail = '';
        try { var j = await res.json(); detail = j.message || ''; } catch (e) { detail = ''; }
        lastErr = new Error('HTTP ' + res.status + (detail ? '：' + detail : ''));

        /* 409 = sha 冲突，重读一次再写 */
        if (res.status === 409 && attempt === 0) { await new Promise(function (r) { setTimeout(r, 600); }); continue; }
        break;
      } catch (e) {
        lastErr = e;
        if (attempt === 0) { await new Promise(function (r) { setTimeout(r, 600); }); continue; }
        break;
      }
    }

    var hint = '';
    if (lastErr) {
      var m = String(lastErr.message || lastErr);
      if (/Failed to fetch|NetworkError|Load failed/i.test(m)) hint = '（网络被拦截，可能是浏览器插件或网络限制）';
      else if (/401/.test(m)) hint = '（写入令牌无效或已过期）';
      else if (/403/.test(m)) hint = '（令牌权限不足或触发限流，稍后再试）';
      else if (/409/.test(m)) hint = '（文件刚被别处修改，已重试仍冲突，请再点一次保存）';
      else if (/422/.test(m)) hint = '（提交内容过大或格式不被接受）';
    }
    var text = '保存失败：' + (lastErr ? (lastErr.message || lastErr) : '未知错误') + hint;
    setStatus(text, 'warn');
    toast(text, 6000);
    console.error('[保存失败]', lastErr);
    return false;
  }

  function bindExport() {
    $('#btnExport').addEventListener('click', function () {
      var blob = new Blob([JSON.stringify({ elements: S.elements, lines: S.lines }, null, 1)],
        { type: 'application/json;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'gas-data-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    });
  }

  function renderAll() { drawBase(); drawFurniture(); drawLines(); renderList(); renderTypeChips(); renderElementList(); renderTypeSummary(); renderDetail(); }

  function boot() {
    bindEdit(); bindElModal(); bindLineModal(); bindExport();
    $('#elType').innerHTML = TYPES.map(function (t) { return '<option>' + t.key + '</option>'; }).join('');
    $('#q').addEventListener('input', function () { S.q = this.value; renderList(); renderElementList(); });
    bindPlacing();
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        $('#loginModal').classList.remove('open');
        $('#elModal').classList.remove('open');
        $('#lineModal').classList.remove('open');
        stopPlacing();
      }
    });
    loadData();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
